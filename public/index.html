<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 移动端跳转：必须放在 viewport meta 之后、任何 <link>/资源加载之前——
         放在 viewport meta 之前的话，部分移动浏览器还没应用
         width=device-width，innerWidth 读到的是默认宽视口（通常
         980px 左右），会把窄屏设备误判成桌面端。放在这里（同步、阻塞
         解析）能在浏览器开始拉取 style.css/content.css/Google Fonts
         之前就跳走，不会有"先看到桌面版窗户闪一下再跳转"的问题。
         用 location.replace 而不是 location.href，是为了不写入 history——
         避免移动端点后退会退回到刚被跳过的桌面版这种怪现象 -->
    <script>
        if (window.innerWidth < 1024) {
            // 保留 query string（尤其是 ?case=xxx）——mobile.html 现在还
            // 读不懂这个参数，没关系，先把它保住，等移动端补上 case study
            // 支持时，分享出去的链接不用重新发一遍
            location.replace('mobile.html' + location.search);
        }
    </script>
    <!-- analytics.js 放在移动端跳转判断之后——窄屏访客这一刻已经在被
         location.replace 带去 mobile.html 的路上，不应该先在 index.html
         这边也初始化一次 gtag、多算一次 page_view，mobile.html 自己的
         <head> 会再加载一次 analytics.js，两边都跑的话同一次访问会被
         计成两次 page_view -->
    <script src="analytics.js"></script>
    <link rel="stylesheet" href="style.css">
    <!-- content.css 是 Work/Play/About 浮层内容（banner、001 编号、项目卡片
         这套排版）的样式，overlay.js 会把 content.html 里对应的 section
         原样搬进浮层——style 得跟着一起加载，不然浮层里全是没样式的裸标签 -->
    <link rel="stylesheet" href="content.css">
    <!-- 字体不再外链 Google Fonts：Montserrat 500 和 Caveat 的 latin 子集已经
         自托管在 assets/fonts/ 下，由 content.css 里的两条 @font-face 引用。
         原来那条 <link rel="stylesheet"> 是渲染阻塞的，而 fonts.googleapis.com
         在中国大陆被屏蔽，大陆访客要等它超时才看得到内容。Monda 一并去掉了，
         全站没有任何 font-family 引用过它。 -->
    <title>Gia Wang - Product Designer</title>
</head>
<body class="intro">

<div id="stage">

    <!-- 背景：铺满不变形 -->
    <div class="bg-layer"></div>

    <!-- 玻璃：叠在背景之上，跟背景用同一套 background-size/position，锁死不会错位 -->
    <div class="glass-layer"></div>

    <!-- 左右两条纯装饰的雾气玻璃：故意放在 bg-layer 之上、window-frame
         之下（叠放顺序见 style.css 的 .fog-edge），这样窗框上的窗帘图案
         永远盖在雾气上面，雾气不会遮住窗帘，也就不用再算"避开窗帘"的
         玻璃缝宽度——尺寸直接按设计稿写死（207×820，顶部46px），不响应式。
         只有环境雾气+生长水珠，没有常驻文字/图标（data-fog="side-left/right"
         对应 fog.js 里的 blank 类型）。 -->
    <div class="fog-frame fog-edge" id="fog-left" data-fog="side-left">
        <div class="fog-glass"><canvas class="fog-canvas"></canvas><canvas class="glow-canvas"></canvas></div>
    </div>
    <div class="fog-frame fog-edge" id="fog-right" data-fog="side-right">
        <div class="fog-glass"><canvas class="fog-canvas"></canvas><canvas class="glow-canvas"></canvas></div>
    </div>

    <!-- 窗框：自由拉伸铺满 -->
    <img class="window-frame" src="assets/images/whole_window_pale.svg" alt="">



    <!-- 46px 顶框 -->
    <div class="top-rail"></div>

    <!-- 818px 内容带：222 / 456 / 316 / 456 / 222 -->
    <div class="band">

        <div class="side left"></div>

        <div class="panel" id="left_panel">
            <div class="project-frame fog-frame" data-fog="work">
                <div class="fog-glass"><canvas class="fog-canvas"></canvas><canvas class="glow-canvas"></canvas></div>
            </div>
            <div class="project-frame fog-frame" data-fog="play">
                <div class="fog-glass"><canvas class="fog-canvas"></canvas><canvas class="glow-canvas"></canvas></div>
            </div>
        </div>

        <!-- 首页本来的中栏内容：像素头像 + 社交图标，一直都在这里，
             展开态时被上面浮动的 .intro-panel 盖住，收起后自然露出 -->
        <div class="panel" id="mid_panel">
            <div class="pixel-avatar" id="pixelAvatar" role="button" tabindex="0" aria-label="About">
                <img src="assets/images/icons/logo.svg" alt="Gia Wang">
            </div>

            <div class="social-links">
                <a class="social-link" id="emailLink" href="mailto:yajiawang@outlook.com" aria-label="Email">
                    <span class="icon-content"><img class="social-icon" src="assets/images/icons/email.svg" alt="Email"></span>
                    <span class="text-content">Email</span>
                </a>
                <a class="social-link" href="https://www.linkedin.com/in/yajia-wang-88b97326a" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                    <span class="icon-content"><img class="social-icon" src="assets/images/icons/LinkedIn.svg" alt="LinkedIn"></span>
                    <span class="text-content">LinkedIn</span>
                </a>
                <a class="social-link" href="https://www.instagram.com/giaovis_/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                    <span class="icon-content"><img class="social-icon" src="assets/images/icons/instagram.svg" alt="Instagram"></span>
                    <span class="text-content">Instagram</span>
                </a>
                <a class="social-link" href="https://drive.google.com/file/d/1mZ0AwV6WGktWj8Gu-W5623a-AgKLKUeA/view?usp=share_link" target="_blank" rel="noopener noreferrer" aria-label="Resume">
                    <span class="icon-content"><img class="social-icon" src="assets/images/icons/resume.svg" alt="Resume"></span>
                    <span class="text-content">Resume</span>
                </a>
            </div>
        </div>

        <div class="panel" id="right_panel">
            <div class="project-frame fog-frame" data-fog="about">
                <div class="fog-glass"><canvas class="fog-canvas"></canvas><canvas class="glow-canvas"></canvas></div>
            </div>
            <div class="project-frame fog-frame" data-fog="song">
                <div class="fog-glass"><canvas class="fog-canvas"></canvas><canvas class="glow-canvas"></canvas></div>
            </div>
        </div>

        <div class="side right"></div>

    </div>

    <!-- 77px 窗台 -->
    <div class="sill"></div>

    <!-- 覆盖层：盖在首页之上，只在展开态可见。收起 = 这一层自己缩窄、淡出、
         隐藏，不是"变形成中栏"——中栏（mid_panel）本来就在下面，一直没动过 -->
    <div class="intro-panel">
        <div class="intro-body">
            <p class="signature">Gia Wang</p>
            <p class="opening-scene-text">
                Product designer working on <span class="highlight">complex workflows</span><br>
                and <span class="highlight">creative tools</span>, with experience in B2B SaaS<br>
                and a long-term focus on music technology.
            </p>
        </div>

        <!-- Enter the wall 按钮：之前挪到跟 .intro-panel 平级、相对 #stage
             按 (743,721)/1672×941 反推的百分比定位，但实测那组坐标本身
             就不是居中的（大概率是设计稿里手动摆放的近似值，不是精确居中
             意图）。改回 .intro-panel 内部、相对这个白色面板自己水平居中：
             left:50%+translateX(-50%)，垂直暂时保留原来的 76.62% 数值，
             只是现在这个百分比是相对 .intro-panel 自己的高度算，不是
             相对 #stage 了 -->
        <button class="enter-wall-btn" type="button">Enter the wall</button>
    </div>

    <!-- 分享出去的 case study 链接（index.html?case=xxx）落地时，要直接
         呈现"墙已收起"的终态，不能先播一遍开场动画再跳过去——不改
         script.js 的 collapse() 流程，而是在它跑起来之前，直接把终态
         需要的几个状态手动设好，让 collapse() 那套动画序列根本没有机会
         启动。这三行是"墙已收起"终态在代码里唯一不是纯 CSS class 驱动
         的部分：
         - body 去掉 intro：绝大部分视觉差异（.glass-layer、
           .project-frame 的雾气模糊、.wall-shadow 宽度、.avatar 的
           显隐）都是 body.intro 选择器驱动的覆盖规则，默认（无 intro）
           就是收起态该有的样子，去掉这个 class 就自动全部到位，不用
           逐个再写
         - .intro-panel 的 visibility：这是唯一的例外，CSS 里从没给它
           声明过 visibility，一直是靠 script.js 的 onWallWidthDone()
           在收起动画真正播完那一刻才用内联样式切成 hidden——这里手动
           补上，不然墙体只是缩小到 286px 那个中间态，不会真的消失
         - #pixelAvatar 的 aria-expanded：跟 collapse() 里设的值保持
           一致，纯粹是无障碍属性，不影响视觉

         必须放在这里（.intro-panel 已经解析完、但后面还有一大截窗框/
         雾气 canvas/项目卡片没解析完）而不是等 DOMContentLoaded——
         同步阻塞的 <script> 会先于浏览器出下一帧画面执行，跟
         index.html 顶部移动端重定向脚本是同一个"抢在渲染之前"的手法。

         没有 ?case= 参数的正常访问，这段代码完全不执行，不产生任何
         影响 -->
    <script>
        if (new URLSearchParams(location.search).has('case')) {
            document.body.classList.remove('intro');
            document.querySelector('.intro-panel').style.visibility = 'hidden';
            var pixelAvatar = document.getElementById('pixelAvatar');
            if (pixelAvatar) pixelAvatar.setAttribute('aria-expanded', 'false');
        }
    </script>

    <!-- 墙体投在下面的阴影：故意不放在 .intro-panel 里面——那个盒子自己
         overflow:hidden，如果阴影是它的子元素、又要露在盒子底边以外，
         会被直接裁掉看不见。跟 .intro-panel 平级、同样绝对定位，靠同一
         组 --intro-* 变量对齐，宽度动画节奏也跟墙体一致 -->
    <div class="wall-shadow"></div>

    <!-- 头像单独浮着，跟 .intro-panel 是平级——3D 翻硬币效果，
         正面 selfie / 背面像素头像，靠 backface-visibility 自动切换，
         不是 opacity 交叉淡化。位置/尺寸两态不变，只转不移不缩。

         三层结构，缺一层都会导致 backface-visibility 失效：
           .avatar       只管定位/尺寸/透视，overflow 必须 visible
           .avatar-flip  只管 3D 翻转（preserve-3d + rotateY），
                         同样 overflow 必须 visible
           .face         真正裁圆的地方（border-radius + overflow:hidden），
                         裁剪被隔离在最内层，不会跟外层的 preserve-3d 打架 -->
    <div class="avatar" role="button" tabindex="0" aria-label="Enter the wall">
        <div class="avatar-flip">
            <div class="face front">
                <img src="assets/images/icons/selfie.webp" alt="Gia Wang">
            </div>
            <div class="face back">
                <img src="assets/images/icons/logo.svg" alt="">
            </div>
        </div>
    </div>

</div>

<!-- Work/Play/About 内容浮层：不离开 index.html、不跳转 content.html。
     首页(#stage)留在背后不卸载，遮罩+面板浮在上面。面板内容是 overlay.js
     用 fetch 从 content.html 里现取现塞的（同一份数据/排版两边共用，不用
     各写一份）。逻辑见 overlay.js。
     关闭入口：点遮罩、按 Esc、或者内容自带的 Home 按钮（目前只有 Work
     banner 里有——Play/About 还是占位内容，没有自己的 banner/Home，
     这两块暂时只能靠遮罩/Esc 关，等它们也做出 banner 就一并有了 HOME） -->
<div class="content-overlay-scrim" id="overlayScrim"></div>
<div class="content-overlay-panel" id="overlayPanel" role="dialog" aria-modal="true" aria-label="Section content">
    <div class="overlay-body" id="overlayBody"></div>
</div>

<!-- <div id="hud"></div> -->
<script src="copy-email.js"></script>
<script src="script.js"></script>
<script src="fog.js"></script>
<!-- 擦玻璃效果的实时调参面板，纯开发用（按 D 键显示/隐藏，默认不可见）。
     完全独立于正式逻辑，只读写 fog.js 暴露的 window.FOG_CONFIG /
     window.__fogHardResetAll，不加载它不影响 fog.js 任何行为。

     只在本机预览时注入：线上访客不会下载这个文件，也不会有 D 键面板。
     判断条件跟 analytics.js 里跳过 GA 的那条保持一致（localhost /
     127.0.0.1），两边改的时候记得一起改。
     文件本身留在 public/ 里，本机通过 Live Server 访问时才取得到。 -->
<script>
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        document.write('<script src="debug-panel.js"><\/script>');
    }
</script>
<script src="grid.js"></script>
<!-- content.js 现在暴露 window.initContentScrollSpy，浮层内容注入后
     overlay.js 要用它重新建立 banner crossfade 这套逻辑（克隆 DOM
     不会带上脚本）。页面刚加载时 content.html 那套 banner 还不存在，
     content.js 自己会判断出来、跳过自动初始化，不会有副作用 -->
<script src="content.js"></script>
<!-- about.js 同理暴露 window.initAboutScrollJack，浮层里 About 区块的
     wheel 劫持/拖拽进度条都要在内容注入后手动重新初始化一次 -->
<script src="about.js"></script>
<!-- case-overlay.js：Selected Work 里 case study 的第二层浮层，独立于
     overlay.js 的一套实现，不改 overlay.js 本身。必须放在 overlay.js
     前面注册——两边都在 document 上监听 Escape，谁先注册谁先跑，
     case-overlay.js 自己的处理器要能在第二层开着时用
     stopImmediatePropagation() 拦掉 overlay.js 的 Escape 逻辑，不然
     按一次 Escape 会把两层一起关掉 -->
<script src="case-overlay.js"></script>
<script src="overlay.js"></script>
<script src="contact-dock.js"></script>
<!-- filter-tuner.js 已废弃，被 debug-panel.js 的「窗户滤镜」分组取代，
     文件现在在仓库根的 dev/ 下，不随站点发布。这行只作存档，不要取消注释。 -->

</body>
</html>
